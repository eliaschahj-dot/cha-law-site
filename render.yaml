services:
  - type: web
    name: cha-law-site
    runtime: node
    plan: free            # 무료: 15분 유휴 시 잠듦(첫 접속 지연). 오픈 후 starter 권장
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL
        value: https://cha-law-site.onrender.com   # 도메인 연결 후 실제 주소로
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: CONTACT_FROM
        sync: false
