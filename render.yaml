services:
  - type: web
    name: cha-law-site
    runtime: node
    plan: starter         # 2026.10.20 유료 전환(0.5 CPU·512MB)
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL
        value: https://www.lawyer-cha.com
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: CONTACT_FROM
        sync: false
      - key: DATA_DIR            # 방문 통계 기록 위치 = 아래 디스크 마운트 경로
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
